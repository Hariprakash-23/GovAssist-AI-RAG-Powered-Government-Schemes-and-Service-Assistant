[project]
name = "govassist-ai"
version = "1.0.0"
description = "RAG-powered government schemes and service assistant"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.0",
    "flask-cors>=4.0.0",
    "python-dotenv>=1.1.1",
    "groq>=0.11.0",
    "chromadb>=0.5.20",
    "sentence-transformers>=5.1.0",
    "pypdf>=6.0.0",
    "requests>=2.32.5",
    "numpy>=2.3.2",
    "tqdm>=4.67.1",
    "gunicorn>=23.0.0"
]

[tool.vercel]
entrypoint = "run:app"
